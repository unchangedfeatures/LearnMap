<script>
        // Interactive Logic for Style Chips
        const chips = document.querySelectorAll('.style-chip');
        
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                const isSelected = chip.getAttribute('data-selected') === 'true';
                
                // Toggle state
                if (isSelected) {
                    chip.setAttribute('data-selected', 'false');
                    chip.classList.remove('is-selected', 'border-primary', 'bg-primary/5');
                    
                    // Revert icon styles
                    const iconContainer = chip.querySelector('div:first-child');
                    iconContainer.classList.remove('bg-primary', 'text-on-primary');
                    iconContainer.classList.add('bg-surface-container', 'text-primary');
                } else {
                    chip.setAttribute('data-selected', 'true');
                    chip.classList.add('is-selected', 'border-primary', 'bg-primary/5');
                    
                    // Apply active icon styles
                    const iconContainer = chip.querySelector('div:first-child');
                    iconContainer.classList.remove('bg-surface-container', 'text-primary');
                    iconContainer.classList.add('bg-primary', 'text-on-primary');
                }
            });
        });

        // Generate Button Loading State Trigger
        const generateBtn = document.getElementById('generateBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');

        generateBtn.addEventListener('click', () => {
            // Show overlay
            loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
            loadingOverlay.classList.add('opacity-100', 'pointer-events-auto');
            
            // Optional: Simulate loading completion and redirect (commented out for visual demo purposes)
