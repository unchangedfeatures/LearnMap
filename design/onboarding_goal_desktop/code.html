<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LearnMap - Onboarding Goal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "tertiary-container": "#ba4e00",
                    "surface-variant": "#e0e3e5",
                    "surface-dim": "#d8dadc",
                    "surface-container": "#eceef0",
                    "on-surface-variant": "#444655",
                    "on-primary-container": "#f4f2ff",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed-variant": "#352ac0",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#e0e3e5",
                    "secondary": "#4c45d5",
                    "inverse-primary": "#bac3ff",
                    "secondary-fixed": "#e2dfff",
                    "on-background": "#191c1e",
                    "background": "#f7f9fb",
                    "outline": "#747686",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#bac3ff",
                    "on-secondary-fixed": "#0e006a",
                    "inverse-on-surface": "#eff1f3",
                    "error": "#ba1a1a",
                    "tertiary": "#933c00",
                    "primary-container": "#4361ee",
                    "tertiary-fixed": "#ffdbcb",
                    "surface": "#f7f9fb",
                    "secondary-container": "#6561f0",
                    "secondary-fixed-dim": "#c2c1ff",
                    "on-surface": "#191c1e",
                    "inverse-surface": "#2d3133",
                    "on-tertiary-fixed": "#341100",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#0031c4",
                    "surface-container-high": "#e6e8ea",
                    "surface-bright": "#f7f9fb",
                    "surface-tint": "#2e4edc",
                    "outline-variant": "#c4c5d7",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#793000",
                    "primary": "#2346d5",
                    "on-secondary-container": "#fffbff",
                    "tertiary-fixed-dim": "#ffb692",
                    "primary-fixed": "#dee1ff",
                    "on-tertiary-container": "#fff1eb",
                    "surface-container-low": "#f2f4f6",
                    "on-primary-fixed": "#001159",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "1rem",
                    "md": "1.5rem",
                    "xl": "4rem",
                    "lg": "2.5rem",
                    "base": "8px",
                    "xs": "0.5rem",
                    "margin": "48px",
                    "max-width": "1440px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "display-xl": ["Inter"],
                    "title-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "label-lg": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "display-xl": ["64px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "letterSpacing": "0", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],
                    "headline-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-md": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "letterSpacing": "0", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "letterSpacing": "0", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f7f9fb;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ambient-shadow {
            box-shadow: 0 10px 30px -5px rgba(35, 70, 213, 0.08);
        }
        .goal-card-active {
            border: 2px solid #2346d5;
            background-color: #ffffff;
            transform: translateY(-2px);
        }
        .progress-bar-segment {
            transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Header / Progress Container -->
<header class="w-full max-w-[1440px] mx-auto px-margin pt-xl flex flex-col items-center">
<div class="w-full max-w-2xl mb-lg">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Step 3 of 4</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">75% Complete</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary progress-bar-segment rounded-full" style="width: 75%;"></div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center px-margin pb-xl">
<div class="max-w-4xl w-full text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-on-background mb-sm">Why are you learning this?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
                We'll use this to set the right pace and recommend the best path.
            </p>
</div>
<!-- Intensity Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-lg w-full max-w-5xl mb-xl">
<!-- Card 1: Just Curious -->
<button class="goal-card group flex flex-col items-start p-lg bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-300 ambient-shadow hover:border-primary" onclick="selectGoal(this)">
<div class="w-12 h-12 rounded-lg bg-primary-fixed flex items-center justify-center mb-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="lightbulb">lightbulb</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Just Curious</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-left mb-md">Explore new topics at a relaxed pace without the pressure of deadlines.</p>
<div class="mt-auto inline-flex items-center px-sm py-xs bg-surface-container rounded-full font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] mr-xs" data-icon="schedule">schedule</span>
                    5-10 min/day
                </div>
</button>
<!-- Card 2: Serious Learner -->
<button class="goal-card group flex flex-col items-start p-lg bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-300 ambient-shadow hover:border-primary" onclick="selectGoal(this)">
<div class="w-12 h-12 rounded-lg bg-secondary-fixed flex items-center justify-center mb-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-secondary" data-icon="trending_up">trending_up</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Serious Learner</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-left mb-md">Build a consistent habit and master core concepts systematically.</p>
<div class="mt-auto inline-flex items-center px-sm py-xs bg-surface-container rounded-full font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] mr-xs" data-icon="schedule">schedule</span>
                    15-20 min/day
                </div>
</button>
<!-- Card 3: Exam Prep -->
<button class="goal-card group flex flex-col items-start p-lg bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-300 ambient-shadow hover:border-primary" onclick="selectGoal(this)">
<div class="w-12 h-12 rounded-lg bg-tertiary-fixed flex items-center justify-center mb-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-tertiary" data-icon="school">school</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Exam Prep</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-left mb-md">Intensive focus to reach peak performance for upcoming certifications.</p>
<div class="mt-auto inline-flex items-center px-sm py-xs bg-surface-container rounded-full font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] mr-xs" data-icon="schedule">schedule</span>
                    30+ min/day
                </div>
</button>
</div>
<!-- Actions -->
<div class="flex flex-col items-center gap-md">
<button class="px-xl py-md bg-outline text-on-primary font-label-lg text-label-lg rounded-full ambient-shadow transition-all duration-300 transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="" id="continueBtn">
                Continue
            </button>
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors">
                I'll decide later
            </button>
</div>
</main>
<!-- Footer Illustration / Visual Polish -->
<div class="w-full h-32 relative overflow-hidden pointer-events-none opacity-50">
<div class="absolute bottom-0 left-0 w-full h-full bg-gradient-to-t from-surface-container-low to-transparent"></div>
<div class="flex justify-around items-end h-full">
<div class="w-32 h-24 bg-primary-fixed-dim rounded-t-full"></div>
<div class="w-48 h-16 bg-secondary-fixed-dim rounded-t-full"></div>
<div class="w-24 h-32 bg-tertiary-fixed-dim rounded-t-full"></div>
<div class="w-40 h-20 bg-primary-fixed-dim rounded-t-full"></div>
</div>
</div>
<script>
        function selectGoal(element) {
            // Remove active class from all cards
            document.querySelectorAll('.goal-card').forEach(card => {
                card.classList.remove('goal-card-active');
                card.classList.add('border-outline-variant');
            });

            // Add active class to selected card
            element.classList.add('goal-card-active');
            element.classList.remove('border-outline-variant');

            // Enable continue button
            const btn = document.getElementById('continueBtn');
            btn.disabled = false;
            btn.classList.remove('bg-outline');
            btn.classList.add('bg-primary', 'hover:bg-primary-container');
        }

        // Add micro-interaction to continue button
        document.getElementById('continueBtn').addEventListener('click', function() {
            if(!this.disabled) {
                this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                setTimeout(() => {
                    alert('Setting your learning pace... Redirecting to final step.');
                    this.innerHTML = 'Continue';
                }, 800);
            }
        });
    </script>
</body></html>
