<body class="font-body-md text-on-surface">
<!-- Shell Suppression: This is a focused onboarding screen, so the Global TopNavBar and SideNavBar are excluded per hierarchy rules. -->
<main class="min-h-screen flex flex-col items-center justify-start pt-xl pb-xl px-margin">
<!-- Progress Indicator -->
<div class="w-full max-w-[800px] mb-lg">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Step 1 of 4</span>
<span class="font-label-lg text-label-lg text-outline">Select Topic</span>
</div>
<div class="h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full transition-all duration-700 ease-out"></div>
</div>
</div>
<!-- Header Content -->
<section class="text-center mb-lg max-w-[720px]">
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm">What do you want to learn?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select a topic to generate your personalized learning roadmap. We'll curate the best resources just for you.</p>
</section>
<!-- Search Input -->
<div class="w-full max-w-[640px] mb-xl group">
<div class="relative flex items-center h-[64px] bg-surface-container-lowest border border-outline-variant rounded-xl px-md transition-all duration-300 focus-within:ring-4 focus-within:ring-primary/10 focus-within:border-primary">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-sm" style="font-size: 24px;">search</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-body-lg font-body-lg text-on-surface placeholder:text-outline/60" placeholder="Search for a topic (e.g., Quantum Physics, Photography...)" type="text"/>
<div class="hidden sm:flex items-center gap-xs text-outline/40">
<kbd class="px-xs py-[2px] bg-surface-container-high rounded text-label-md font-label-md">⌘</kbd>
<kbd class="px-xs py-[2px] bg-surface-container-high rounded text-label-md font-label-md">K</kbd>
</div>
</div>
</div>
<!-- 4-Column Grid of Topic Cards -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-md w-full max-w-[1200px]">
<!-- Mathematics Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">calculate</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Mathematics</h3>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Calculus, Linear Algebra, and Statistical Theory.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Computer Science Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">code</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Computer Sci</h3>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Algorithms, Web Dev, and System Architecture.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Design Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">palette</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Design</h3>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">UI/UX, Visual Branding, and Product Strategy.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- History Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">history_edu</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">History</h3>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">World Civilizations, Revolutions, and Culture.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Physics Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">flare</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Physics</h3>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Astrophysics, Quantum Mechanics, and Dynamics.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Economics Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">

<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Microeconomics, Markets, and Global Finance.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Biology Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">biotech</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Biology</h3>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Genetics, Molecular structures, and Ecology.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Philosophy Card -->
<button class="topic-card group relative flex flex-col p-lg bg-surface-container-lowest rounded-xl border border-outline-variant text-left transition-all duration-300 topic-card-shadow overflow-hidden" onclick="toggleCard(this)">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/5 text-primary mb-md group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">psychology</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Philosophy</h3>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Ethics, Logic, and Classical Thought.</p>
<div class="absolute top-4 right-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- Bottom Actions Area -->
<div class="w-full max-w-[1200px] mt-xl flex items-center justify-between border-t border-outline-variant pt-lg">
<button class="flex items-center gap-xs text-on-surface-variant font-label-lg text-label-lg hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
        Back to Dashboard
      </button>
<div class="flex items-center gap-md">
<p class="hidden sm:block font-body-md text-body-md text-on-surface-variant" id="selection-count">0 topics selected</p>
<button class="h-12 px-lg bg-outline-variant text-on-primary-container rounded-lg font-label-lg text-label-lg transition-all duration-300 disabled:cursor-not-allowed hover:bg-primary-container active:scale-95 shadow-lg shadow-primary/10" disabled="" id="continue-btn">
          Continue
        </button>
</div>
</div>
</main>
<!-- Interactive Backdrop Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40 overflow-hidden">
<div class="absolute -top-[10%] -left-[5%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute top-[60%] -right-[10%] w-[500px] h-[500px] bg-secondary/5 rounded-full blur-[120px]"></div>
</div>
<script>
    let selectedTopics = 0;

    function toggleCard(element) {
      const isSelected = element.getAttribute('data-selected') === 'true';
      const checkIcon = element.querySelector('.absolute');
      
      if (!isSelected) {
        element.setAttribute('data-selected', 'true');
        element.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
        element.classList.add('border-primary', 'bg-primary/5');
        checkIcon.classList.remove('opacity-0');
        checkIcon.classList.add('opacity-100');
        selectedTopics++;
      } else {
        element.setAttribute('data-selected', 'false');
        element.classList.add('border-outline-variant', 'bg-surface-container-lowest');
        element.classList.remove('border-primary', 'bg-primary/5');
        checkIcon.classList.add('opacity-0');
        checkIcon.classList.remove('opacity-100');
        selectedTopics--;
      }

      updateUI();
    }

    function updateUI() {
      const btn = document.getElementById('continue-btn');
      const countLabel = document.getElementById('selection-count');
      
      countLabel.innerText = `${selectedTopics} topic${selectedTopics !== 1 ? 's' : ''} selected`;
      
      if (selectedTopics > 0) {
        btn.disabled = false;
        btn.classList.remove('bg-outline-variant', 'text-on-primary-container');
        btn.classList.add('bg-primary', 'text-on-primary');
      } else {
        btn.disabled = true;
        btn.classList.add('bg-outline-variant', 'text-on-primary-container');
        btn.classList.remove('bg-primary', 'text-on-primary');
      }
    }

    // Keyboard support for search
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.querySelector('input').focus();
      }
    });
  </script>
</body></html>
