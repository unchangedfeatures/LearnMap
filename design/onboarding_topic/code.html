<style>
        body {
            background-color: #F4F6FF;
            max-width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .progress-bar-container {
            display: flex;
            gap: 4px;
            padding: 8px 20px;
            background-color: transparent;
        }
        
        .progress-segment {
            height: 8px;
            flex: 1;
            border-radius: 9999px;
            background-color: rgba(67, 97, 238, 0.1);
        }
        
        .progress-segment.active {
            background-color: #4361EE;
        }
        
        .chip {
            padding: 12px 16px;
            border-radius: 12px;
            background-color: white;
            border: 1.5px solid transparent;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
        }
        
        .chip.selected {
            border-color: #4361EE;
            background-color: rgba(67, 97, 238, 0.05);
            box-shadow: 0 4px 20px rgba(67, 97, 238, 0.15);
        }
        
        .search-input:focus {
            outline: none;
            border-color: #4361EE;
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface">
<!-- Top AppBar (Onboarding variant, suppressed standard nav) -->
<header class="w-full flex justify-between items-center px-margin-mobile h-[52px] bg-background">
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm text-primary">LearnMap</span>
</div>
<div class="font-label-caps text-label-caps text-on-surface-variant">1 of 4</div>
</header>
<!-- Progress Bars -->
<div class="progress-bar-container">
<div class="progress-segment active"></div>
<div class="progress-segment"></div>
<div class="progress-segment"></div>
<div class="progress-segment"></div>
</div>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pt-stack-lg pb-[100px] flex flex-col gap-stack-lg">
<!-- Header -->
<div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">What do you want to learn?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select a topic to generate your personalized learning roadmap.</p>
</div>
<!-- Search -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="search-input w-full bg-white border-[1.5px] border-surface-variant rounded-xl py-3 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all duration-200" placeholder="Search topics..." type="text">
</div>
<!-- Topic Grid -->
<div class="grid grid-cols-2 gap-gutter">
<div class="chip selected" onclick="toggleChip(this)">
<span class="text-[20px]">🧮</span>
<span class="font-body-sm text-body-sm font-semibold">Mathematics</span>
</div>
<div class="chip" onclick="toggleChip(this)">
<span class="text-[20px]">💻</span>
<span class="font-body-sm text-body-sm font-semibold">Computer Sci</span>
</div>
<div class="chip" onclick="toggleChip(this)">
<span class="text-[20px]">🎨</span>
<span class="font-body-sm text-body-sm font-semibold">Design</span>
</div>
<div class="chip" onclick="toggleChip(this)">
<span class="text-[20px]">🌍</span>
<span class="font-body-sm text-body-sm font-semibold">History</span>
</div>

<span class="text-[20px]">🔬</span>

</div>
<div class="chip" onclick="toggleChip(this)">
<span class="text-[20px]">📈</span>
<span class="font-body-sm text-body-sm font-semibold">Economics</span>
</div>

<span class="text-[20px]">🧠</span>

</div>

</div>

<span class="text-[20px]">🎵</span>
<span class="font-body-sm text-body-sm font-semibold">Music Theory</span>
</div>
<div class="chip" onclick="toggleChip(this)">
<span class="text-[20px]">📸</span>

<!-- Sticky Bottom Button -->

                Continue
            </button>
</div>
</div>
<script>
        function toggleChip(element) {
            // Remove selected class from all chips
            document.querySelectorAll('.chip').forEach(chip => {
                chip.classList.remove('selected');
            });
            // Add selected class to clicked chip
            element.classList.add('selected');
        }
    </script>
