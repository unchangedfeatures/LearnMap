<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz Question Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Literata:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-container": "#f4f2ff",
                      "surface-dim": "#d7dae2",
                      "on-tertiary-fixed-variant": "#005320",
                      "inverse-surface": "#2d3037",
                      "error-container": "#ffdad6",
                      "tertiary": "#006529",
                      "secondary-fixed-dim": "#ccbdff",
                      "outline": "#747686",
                      "primary": "#2346d5",
                      "on-tertiary": "#ffffff",
                      "on-secondary-container": "#fffbff",
                      "on-primary-fixed-variant": "#0031c4",
                      "on-secondary": "#ffffff",
                      "tertiary-container": "#0d8038",
                      "inverse-primary": "#bac3ff",
                      "surface-container-highest": "#e0e2eb",
                      "surface-container-high": "#e6e8f1",
                      "on-surface": "#181c22",
                      "on-secondary-fixed-variant": "#4d17c5",
                      "primary-container": "#4361ee",
                      "surface-tint": "#2e4edc",
                      "on-error": "#ffffff",
                      "primary-fixed": "#dee1ff",
                      "on-tertiary-container": "#d1ffd1",
                      "secondary": "#6339db",
                      "inverse-on-surface": "#eef0f9",
                      "surface-bright": "#f9f9ff",
                      "secondary-fixed": "#e7deff",
                      "on-primary-fixed": "#001159",
                      "surface-container-low": "#f1f3fc",
                      "error": "#ba1a1a",
                      "surface-variant": "#e0e2eb",
                      "primary-fixed-dim": "#bac3ff",
                      "secondary-container": "#7d56f5",
                      "tertiary-fixed": "#92f9a1",
                      "on-surface-variant": "#444655",
                      "tertiary-fixed-dim": "#77dc87",
                      "on-secondary-fixed": "#1f005f",
                      "surface": "#f9f9ff",
                      "on-primary": "#ffffff",
                      "surface-container": "#ebeef6",
                      "surface-container-lowest": "#ffffff",
                      "outline-variant": "#c4c5d7",
                      "on-tertiary-fixed": "#002109",
                      "on-background": "#181c22",
                      "background": "#f9f9ff",
                      "on-error-container": "#93000a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "8px",
                      "gutter": "16px",
                      "stack-md": "16px",
                      "safe-area-bottom": "34px",
                      "margin-mobile": "20px",
                      "stack-lg": "24px",
                      "base": "4px"
              },
              "fontFamily": {
                      "body-sm": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "guide-text": ["Literata"],
                      "label-caps": ["Inter"],
                      "display-lg": ["Inter"]
              },
              "fontSize": {
                      "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                      "guide-text": ["17px", {"lineHeight": "1.8", "fontWeight": "400"}],
                      "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}]
              }
            }
          }
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-sm relative selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Transactional Top Header -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-xl px-margin-mobile pt-4 pb-2 flex flex-col gap-stack-sm">
<div class="flex justify-between items-center w-full">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Chapter 2 Quiz</h1>
<div class="w-10 h-10"></div> <!-- Spacer for flex alignment -->
</div>
<!-- Progress Indicator -->
<div class="flex flex-col items-center justify-center gap-base mt-2">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Question 2 of 5</span>
<div class="flex gap-2 items-center mt-2">
<div aria-hidden="true" class="h-2 w-2 rounded-full bg-primary"></div>
<div aria-hidden="true" class="h-2.5 w-2.5 rounded-full bg-primary ring-4 ring-primary-fixed"></div>
<div aria-hidden="true" class="h-2 w-2 rounded-full bg-surface-container-highest"></div>
<div aria-hidden="true" class="h-2 w-2 rounded-full bg-surface-container-highest"></div>
<div aria-hidden="true" class="h-2 w-2 rounded-full bg-surface-container-highest"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto no-scrollbar pt-[140px] pb-[120px] px-margin-mobile flex flex-col gap-stack-lg">
<!-- Question Card (Level 1 Elevation) -->
<div class="bg-surface-container-lowest rounded-xl p-stack-lg shadow-[0_4px_20px_0_rgba(0,0,0,0.1)] border border-surface-container-low">
<h2 class="font-headline-md text-headline-md text-on-surface">
                Which of the following best describes standard deviation?
            </h2>
</div>
<!-- Answer Options List -->
<div aria-label="Answer options" class="flex flex-col gap-stack-md" role="radiogroup">
<!-- Option A (Selected State) -->
<button aria-checked="true" class="group flex items-start w-full text-left p-4 rounded-xl border-[1.5px] border-primary bg-primary-fixed/10 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" role="radio">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-headline-sm text-headline-sm mr-4 mt-0.5 shadow-sm">
                    A
                </div>
<span class="font-body-lg text-body-lg text-on-surface pt-1">
                    A measure of the amount of variation or dispersion of a set of values.
                </span>
</button>
<!-- Option B (Unselected State) -->
<button aria-checked="false" class="group flex items-start w-full text-left p-4 rounded-xl border-[1.5px] border-outline-variant bg-surface-container-lowest hover:border-outline hover:bg-surface transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" role="radio">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant group-hover:bg-surface-container-highest group-hover:text-on-surface transition-colors flex items-center justify-center font-headline-sm text-headline-sm mr-4 mt-0.5">
                    B
                </div>
<span class="font-body-lg text-body-lg text-on-surface pt-1">
                    The middle value in a sorted list of numerical data points.
                </span>
</button>
<!-- Option C (Unselected State) -->
<button aria-checked="false" class="group flex items-start w-full text-left p-4 rounded-xl border-[1.5px] border-outline-variant bg-surface-container-lowest hover:border-outline hover:bg-surface transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" role="radio">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant group-hover:bg-surface-container-highest group-hover:text-on-surface transition-colors flex items-center justify-center font-headline-sm text-headline-sm mr-4 mt-0.5">
                    C
                </div>
<span class="font-body-lg text-body-lg text-on-surface pt-1">
                    The difference between the highest and lowest values in a distribution.
                </span>
</button>
<!-- Option D (Unselected State) -->
<button aria-checked="false" class="group flex items-start w-full text-left p-4 rounded-xl border-[1.5px] border-outline-variant bg-surface-container-lowest hover:border-outline hover:bg-surface transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" role="radio">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant group-hover:bg-surface-container-highest group-hover:text-on-surface transition-colors flex items-center justify-center font-headline-sm text-headline-sm mr-4 mt-0.5">
                    D
                </div>
<span class="font-body-lg text-body-lg text-on-surface pt-1">
                    The total sum of all values divided by the number of values.
                </span>
</button>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-gradient-to-t from-background via-background/95 to-transparent pt-8 pb-safe-area-bottom px-margin-mobile">
<button class="w-full bg-primary text-on-primary rounded-xl py-4 flex justify-center items-center font-headline-sm text-headline-sm shadow-md hover:bg-primary/90 active:scale-[0.98] transition-all duration-200">
            Check Answer
        </button>
</div>
</body></html>
